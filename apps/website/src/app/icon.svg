<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Coptic cross">
  <!--
    An equal-armed Coptic cross with flared arm ends.

    This is the small mark, and it is deliberately NOT the parish seal. The seal
    (assets/St Philopater & St. Mena Logo.svg) is two saints, a horse and two
    camels inside a lettered arch; at the 16-32px a browser tab actually renders,
    it is an indistinct smudge. Detailed marks do not reduce. The seal is used
    where there is room for it — the masthead, the touch icon, the OG card.

    Drawn rather than bitmapped so it stays crisp at any size. It is also the
    source `npm run assets` renders favicon.ico from, which is the file that
    actually silences the /favicon.ico requests — declaring this icon does not.
    Browsers probe /favicon.ico regardless of <link rel="icon">, and with
    nothing there the request falls through to the [section] dynamic route and
    500s on every page load in dev.
  -->
  <rect width="32" height="32" rx="6" fill="#8c2f26"/>
  <g fill="#fbf9f5">
    <!-- Vertical arm, flared at both ends. -->
    <path d="M13.6 5.5h4.8v21h-4.8z"/>
    <path d="M11.4 4.2h9.2v2.6h-9.2zM11.4 25.2h9.2v2.6h-9.2z"/>
    <!-- Horizontal arm, flared to match. -->
    <path d="M5.5 13.6h21v4.8h-21z"/>
    <path d="M4.2 11.4h2.6v9.2H4.2zM25.2 11.4h2.6v9.2h-2.6z"/>
  </g>
</svg>
